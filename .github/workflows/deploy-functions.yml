# Deploys the Supabase Edge Function(s) in supabase/functions whenever they change on `partner`.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
# Optional secret: ZERNIO_API_KEY — if set here, it's copied into the function's secrets too.
name: Deploy Supabase functions

on:
  push:
    branches: [partner]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::warning::Skipping: add the SUPABASE_ACCESS_TOKEN repository secret (and the NEXT_PUBLIC_SUPABASE_URL variable) to deploy the social function automatically. See README → Social posting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ref=$(echo "$SUPABASE_URL" | sed -E 's#^https://([^.]+)\..*#\1#')" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest

      - name: Set Zernio key
        if: steps.check.outputs.skip != 'true' && env.ZERNIO_API_KEY != ''
        run: supabase secrets set ZERNIO_API_KEY="$ZERNIO_API_KEY" --project-ref "${{ steps.check.outputs.ref }}"

      - name: Deploy social function
        if: steps.check.outputs.skip != 'true'
        run: supabase functions deploy social --project-ref "${{ steps.check.outputs.ref }}" --use-api
