# Builds the networking site and publishes it to GitHub Pages at https://networking.obclub.co
#
# A repository can only serve one custom domain on GitHub Pages, and this one serves partner.obclub.co.
# So the site is built here and pushed to the gh-pages branch of a second repository (default:
# <owner>/networking) that exists only to host it. One-time setup: README → "Put it live".
name: Deploy networking.obclub.co

on:
  push:
    branches: [networking]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: networking-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOMAIN: networking.obclub.co
      PAGES_REPO: ${{ vars.NETWORKING_PAGES_REPO || format('{0}/networking', github.repository_owner) }}
      # Same Supabase project as the partner site unless NETWORKING_* variables are set.
      SUPABASE_URL: ${{ vars.NETWORKING_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_KEY: ${{ vars.NETWORKING_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check settings
        env:
          PAGES_TOKEN: ${{ secrets.NETWORKING_PAGES_TOKEN }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::No Supabase settings found. The site will deploy, but logging in won't work until they're set (README → Put it live)."
          fi
          if [ -z "$PAGES_TOKEN" ]; then
            echo "::error::Add the NETWORKING_PAGES_TOKEN secret: a token that can push to $PAGES_REPO (README → Put it live)."
            exit 1
          fi

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://${{ env.DOMAIN }}

      - name: Publish to ${{ env.PAGES_REPO }}
        working-directory: out
        env:
          PAGES_TOKEN: ${{ secrets.NETWORKING_PAGES_TOKEN }}
        run: |
          echo "$DOMAIN" > CNAME
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${PAGES_TOKEN}@github.com/${PAGES_REPO}.git" gh-pages
