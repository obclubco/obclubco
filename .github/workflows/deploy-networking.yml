# Builds the networking site and publishes it to GitHub Pages at https://networking.obclub.co
#
# A repository can only serve one custom domain on GitHub Pages, and this one serves partner.obclub.co.
# So the site is built here and pushed to the gh-pages branch of a second repository (default:
# <owner>/networking) that exists only to host it. One-time setup: README → "Put it live".
#
# GitHub Pages can't send security headers (HSTS, X-Frame-Options, …). With the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets set, the site is also published to Cloudflare Pages, which sends the headers in
# out/_headers (README → Security headers).
name: Deploy networking.obclub.co

on:
  push:
    branches: [networking]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: networking-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOMAIN: networking.obclub.co
      PAGES_REPO: ${{ vars.NETWORKING_PAGES_REPO || format('{0}/networking', github.repository_owner) }}
      # The networking Supabase project: NETWORKING_SUPABASE_URL and NETWORKING_SUPABASE_ANON_KEY, as Actions
      # variables (secrets work too). Without them the site uses the partner site's project.
      SUPABASE_URL: ${{ vars.NETWORKING_SUPABASE_URL || secrets.NETWORKING_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_KEY: ${{ vars.NETWORKING_SUPABASE_ANON_KEY || secrets.NETWORKING_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check settings
        env:
          PAGES_TOKEN: ${{ secrets.NETWORKING_PAGES_TOKEN }}
          PARTNER_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          URL_FROM: ${{ vars.NETWORKING_SUPABASE_URL && 'variable' || secrets.NETWORKING_SUPABASE_URL && 'secret' || 'not set' }}
          KEY_FROM: ${{ vars.NETWORKING_SUPABASE_ANON_KEY && 'variable' || secrets.NETWORKING_SUPABASE_ANON_KEY && 'secret' || 'not set' }}
        run: |
          if [ -z "$PAGES_TOKEN" ]; then
            echo "::error::Add the NETWORKING_PAGES_TOKEN secret: a token that can push to $PAGES_REPO (README → Put it live)."
            exit 1
          fi
          echo "NETWORKING_SUPABASE_URL: $URL_FROM. NETWORKING_SUPABASE_ANON_KEY: $KEY_FROM."
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::No Supabase settings found. The site will deploy, but logging in won't work until they're set (README → Put it live)."
            exit 0
          fi
          # Only the public anon / publishable key may go into the site, and from the same project as the URL.
          node <<'JS'
          const { SUPABASE_URL: url, SUPABASE_KEY: key, PARTNER_URL: partnerUrl } = process.env;
          const fail = (message) => {
            console.log(`::error::${message} (README → Put it live, step c)`);
            process.exit(1);
          };
          const dashboard = url.match(/^https?:\/\/(?:www\.)?supabase\.com\/dashboard\/project\/([a-z0-9]+)/);
          if (dashboard) fail(`NETWORKING_SUPABASE_URL is a link to the Supabase dashboard. Use the project's API address instead: https://${dashboard[1]}.supabase.co`);
          if (!/^https:\/\/\S+$/.test(url)) fail("NETWORKING_SUPABASE_URL should look like https://abcdefghijklmnop.supabase.co, with nothing before or after it.");
          const project = (url.match(/^https:\/\/([a-z0-9]+)\.supabase\.co\/?$/) || [])[1];
          let role = "unknown", ref;
          if (key.startsWith("sb_publishable_")) role = "anon";
          else if (key.startsWith("sb_secret_")) role = "secret";
          else try { ({ role, ref } = JSON.parse(Buffer.from(key.split(".")[1], "base64url"))); } catch {}
          if (role === "service_role" || role === "secret") fail("NETWORKING_SUPABASE_ANON_KEY is a secret key, which must never go into a website. Use the anon / publishable key.");
          if (role !== "anon") fail("NETWORKING_SUPABASE_ANON_KEY doesn't look like a Supabase anon / publishable key.");
          if (ref && project && ref !== project) fail(`The URL is for Supabase project ${project} but the key is for project ${ref}. Copy both from the same project.`);
          if (url === partnerUrl) console.log(`::warning::Using the partner site's Supabase project (${project || url}): NETWORKING_SUPABASE_URL and NETWORKING_SUPABASE_ANON_KEY aren't set in this repository's Actions variables.`);
          else console.log(`::notice::Using Supabase project ${project || url}.`);
          JS

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://${{ env.DOMAIN }}

      - name: Cloudflare Pages set up?
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing to GitHub Pages only, which can't send security headers. To send them, add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (README → Security headers)."
          fi

      # Before the GitHub Pages step, which turns out/ into a git repository.
      - name: Publish to Cloudflare Pages (with the security headers)
        if: steps.cloudflare.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'obc-networking' }}
        run: |
          test -f out/_headers || { echo "::error::out/_headers is missing: npm run build should write it."; exit 1; }
          # The first time, this creates the project; after that it already exists.
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main >/dev/null 2>&1 || true
          npx --yes wrangler@4 pages deploy out --project-name="$PROJECT" --branch=main --commit-dirty=true

      - name: Publish to ${{ env.PAGES_REPO }}
        working-directory: out
        env:
          PAGES_TOKEN: ${{ secrets.NETWORKING_PAGES_TOKEN }}
        run: |
          echo "$DOMAIN" > CNAME
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${PAGES_TOKEN}@github.com/${PAGES_REPO}.git" gh-pages
