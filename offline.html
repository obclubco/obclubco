<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060606">
<title>Offline · OBC Partners</title>
<style>
  html, body { margin: 0; height: 100%; background: #060606; color: #f4f4f2; }
  body { display: grid; place-items: center; font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; letter-spacing: .03em; text-align: center; padding: 24px; box-sizing: border-box;
    background-image: radial-gradient(ellipse 70% 55% at 50% 0%, rgba(255,255,255,.08), transparent 70%),
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size: 100% 100%, 64px 64px, 64px 64px; }
  .mark { font: 600 56px/1 Georgia, serif; letter-spacing: -.03em; }
  p { color: #9b9b9b; max-width: 320px; margin: 18px auto 28px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 12px 24px; background: #fff; color: #060606; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <div class="mark">OBC</div>
    <p>You're offline. Check your internet connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
